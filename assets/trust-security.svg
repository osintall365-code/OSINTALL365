<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d"><title id="t">OSINTALL365 trust and security principles</title><desc id="d">Four principles represented as secure panels: authorized scope, source discipline, human oversight, and practical reporting.</desc><rect width="720" height="440" rx="24" fill="#06111b"/><circle cx="360" cy="220" r="102" fill="#091c2a" stroke="#00a8ff" stroke-width="3"/><path d="M360 150l58 20v54c0 49-29 76-58 91-29-15-58-42-58-91v-54z" fill="#0d2a3d" stroke="#1b9de0" stroke-width="3"/><path d="M334 220l18 18 38-43" fill="none" stroke="#00a8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g fill="#0b1b28" stroke="#20506b"><rect x="38" y="42" width="270" height="112" rx="16"/><rect x="412" y="42" width="270" height="112" rx="16"/><rect x="38" y="286" width="270" height="112" rx="16"/><rect x="412" y="286" width="270" height="112" rx="16"/></g><g fill="#00a8ff" font-family="system-ui,sans-serif" font-weight="800"><text x="64" y="78" font-size="12">01 • AUTHORIZED SCOPE</text><text x="438" y="78" font-size="12">02 • SOURCE DISCIPLINE</text><text x="64" y="322" font-size="12">03 • HUMAN OVERSIGHT</text><text x="438" y="322" font-size="12">04 • PRACTICAL REPORTING</text></g><g fill="#c9dce8" font-family="system-ui,sans-serif" font-size="12"><text x="64" y="105">Every engagement starts with a</text><text x="64" y="124">defined, lawful objective and scope.</text><text x="438" y="105">Findings are documented and</text><text x="438" y="124">grounded in available evidence.</text><text x="64" y="349">Consequential decisions remain</text><text x="64" y="368">under responsible human review.</text><text x="438" y="349">Clear findings become actionable</text><text x="438" y="368">risk-reduction recommendations.</text></g></svg>