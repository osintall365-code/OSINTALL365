<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d"><title id="t">Investigative workflow</title><desc id="d">A professional four-stage investigative workflow from assessment through documented findings.</desc><rect width="720" height="440" rx="24" fill="#06101a"/><text x="42" y="56" fill="#00a8ff" font-family="monospace" font-size="12" font-weight="800" letter-spacing="2">INVESTIGATIVE WORKFLOW</text><text x="42" y="88" fill="#eaf5fb" font-family="system-ui,sans-serif" font-size="23" font-weight="800">ASSESS → ANALYZE → INVESTIGATE → STRENGTHEN</text><g transform="translate(42 132)"><g><rect width="145" height="170" rx="16" fill="#0b1b28" stroke="#20506b"/><circle cx="34" cy="38" r="20" fill="#00a8ff"/><text x="27" y="44" fill="#001018" font-family="monospace" font-size="13" font-weight="900">01</text><text x="22" y="88" fill="#f0f7fb" font-family="system-ui,sans-serif" font-size="18" font-weight="800">ASSESS</text><text x="22" y="116" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">Define scope,</text><text x="22" y="136" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">objectives and</text><text x="22" y="156" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">risk indicators.</text></g><g transform="translate(166)"><rect width="145" height="170" rx="16" fill="#0b1b28" stroke="#20506b"/><circle cx="34" cy="38" r="20" fill="#00a8ff"/><text x="27" y="44" fill="#001018" font-family="monospace" font-size="13" font-weight="900">02</text><text x="22" y="88" fill="#f0f7fb" font-family="system-ui,sans-serif" font-size="18" font-weight="800">ANALYZE</text><text x="22" y="116" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">Corroborate</text><text x="22" y="136" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">public-source and</text><text x="22" y="156" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">authorized data.</text></g><g transform="translate(332)"><rect width="145" height="170" rx="16" fill="#0b1b28" stroke="#20506b"/><circle cx="34" cy="38" r="20" fill="#00a8ff"/><text x="27" y="44" fill="#001018" font-family="monospace" font-size="13" font-weight="900">03</text><text x="22" y="88" fill="#f0f7fb" font-family="system-ui,sans-serif" font-size="18" font-weight="800">INVESTIGATE</text><text x="22" y="116" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">Document facts,</text><text x="22" y="136" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">sources, leads and</text><text x="22" y="156" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">material gaps.</text></g><g transform="translate(498)"><rect width="145" height="170" rx="16" fill="#0b1b28" stroke="#20506b"/><circle cx="34" cy="38" r="20" fill="#00a8ff"/><text x="27" y="44" fill="#001018" font-family="monospace" font-size="13" font-weight="900">04</text><text x="22" y="88" fill="#f0f7fb" font-family="system-ui,sans-serif" font-size="18" font-weight="800">STRENGTHEN</text><text x="22" y="116" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">Deliver practical</text><text x="22" y="136" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">risk-reduction</text><text x="22" y="156" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="12">recommendations.</text></g></g><rect x="42" y="342" width="636" height="50" rx="12" fill="#081a26" stroke="#1d4b67"/><text x="66" y="373" fill="#78d3ff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HUMAN JUDGMENT</text><text x="238" y="373" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="13">+</text><text x="268" y="373" fill="#78d3ff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">AI-ASSISTED ANALYSIS</text><text x="500" y="373" fill="#91a8b8" font-family="system-ui,sans-serif" font-size="13">→ decision-ready findings</text></svg>